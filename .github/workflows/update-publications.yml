name: Update publications

on:
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch publications from Google Scholar
        run: python fetch_scholar.py
        continue-on-error: true   # Scholar may rate-limit; keep the old file
        timeout-minutes: 5        # Scholar can hang instead of erroring when it blocks CI IPs

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain publications.json scholar-stats.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add publications.json scholar-stats.json
            git commit -m "Update publications and citation stats from Google Scholar"
            git push
          else
            echo "No changes."
          fi
